<style>
/* Layout: a printed-atlas page. Thin header with the name and two menus; the map or the
   curves fill the rest, unboxed, with small captions placed beside them. */
:root{
  color-scheme:light;
  --paper:#f5f1e8; --paper2:#ece6d9; --ink:#2b1f19; --ink2:#6e6058; --rule:#d6ccbb; --rule2:#b9ac98;
  --wine:#7a1f2e; --olive:#6b7536; --slate:#4e6878; --vine:#b9bf8f;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"Public Sans", "Helvetica Neue", Arial, sans-serif;
  --bar:54px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
a{color:var(--wine);text-underline-offset:2px}

/* header */
.top{position:fixed;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:22px;background:var(--paper);border-bottom:1px solid var(--rule);z-index:30}
.brand{font:500 23px/1 var(--serif);letter-spacing:.005em;white-space:nowrap}
.top .sp{flex:1}

/* dropdown menus */
.dd{position:relative}
.dd-b{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--ink);font-size:14px}
.dd-b .k{color:var(--ink2)}
.dd-b::after{content:"";width:6px;height:6px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:translateY(-2px) rotate(45deg);margin-left:3px;opacity:.6}
.dd-b:hover{color:var(--wine)}
.dd-m{position:absolute;top:calc(100% + 6px);left:-10px;min-width:180px;max-height:min(420px,70vh);overflow-y:auto;margin:0;padding:6px 0;list-style:none;background:var(--paper);border:1px solid var(--rule2);border-radius:3px;z-index:40;
  opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .18s,transform .18s}
.dd.open .dd-m{opacity:1;transform:none;pointer-events:auto}
.dd.right .dd-m{left:auto;right:-6px}
.dd-m button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 14px;cursor:pointer;white-space:nowrap}
.dd-m button:hover,.dd-m button:focus{background:var(--paper2)}
.dd-m button[aria-checked="true"]{color:var(--wine);font-weight:600}
.dd-m small{color:var(--ink2);margin-left:6px;font-size:12px}

/* stage */
.stage{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));left:0;right:0;bottom:0}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
.view.on{opacity:1;visibility:visible;transition:opacity .4s ease}

/* map */
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.canton{fill:#efe9dc;stroke:var(--rule2);stroke-width:.8}
.region{fill:transparent;stroke:#8f8170;stroke-width:1;cursor:pointer}
.region:hover{fill:rgba(122,31,46,.04)}
.vine{fill:var(--vine);stroke:none;opacity:.9}
.commune{fill:transparent;stroke:#a89a86;stroke-width:.6;stroke-dasharray:2 2;cursor:pointer}
.commune:hover,.commune.sel{fill:rgba(107,117,54,.08)}
.clab{font:italic 400 12px var(--serif);fill:var(--ink2);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.rlab{font:500 26px var(--serif);fill:var(--ink);text-anchor:middle;pointer-events:none;letter-spacing:.14em;text-transform:uppercase;paint-order:stroke;stroke:var(--paper);stroke-width:5px}
.cave{cursor:pointer;stroke:#fffaf2;stroke-width:1}
.cave.empty{fill:none;stroke:#a3968a}
.cave.sel{stroke:var(--ink);stroke-width:1.6}
svg *{vector-effect:non-scaling-stroke}

.mapui{position:absolute;inset:0;pointer-events:none}
.mapui > *{pointer-events:auto}
.search{position:absolute;top:16px;left:max(20px,env(safe-area-inset-left,0px));width:min(260px,calc(100% - 40px))}
.search input{width:100%;background:rgba(245,241,232,.9);border:0;border-bottom:1px solid var(--rule2);padding:6px 0;outline:none;font-size:14px}
.search input::placeholder{color:var(--ink2)}
.hits{margin-top:6px;background:var(--paper);border:1px solid var(--rule2);border-radius:3px;max-height:300px;overflow-y:auto}
.hits button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 12px;cursor:pointer}
.hits button:hover,.hits button:focus{background:var(--paper2)}
.hits small{color:var(--ink2);margin-left:6px}
.reset{position:absolute;top:18px;left:calc(max(20px,env(safe-area-inset-left,0px)) + min(260px,calc(100% - 40px)) + 18px);background:none;border:0;color:var(--wine);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s;padding:4px 0}
.reset.on{opacity:1;pointer-events:auto}
.legend{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(245,241,232,.88);padding:8px 10px 6px;margin-left:-10px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;max-width:min(300px,calc(100% - 40px))}
.legend .row{display:flex;align-items:center;gap:8px}
.ramp{display:inline-flex;gap:2px}.ramp i{width:22px;height:8px;display:block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sw{width:14px;height:8px;background:var(--vine);display:inline-block}

/* cave card */
.card{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));width:min(350px,calc(100% - 32px));max-height:calc(100% - 28px - env(safe-area-inset-bottom,0px));overflow-y:auto;
  background:var(--paper);border:1px solid var(--rule2);border-radius:3px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card figure{margin:0;position:relative}
.card figure img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--paper2)}
.card figcaption{position:absolute;right:6px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card h2{font:500 24px/1.1 var(--serif);margin:0 22px 0 0;text-wrap:balance}
.card .where{color:var(--ink2);font-size:13px;margin-top:-6px}
.card .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(245,241,232,.92);cursor:pointer;font-size:17px;line-height:1;color:var(--ink);z-index:2}
.idx{display:flex;align-items:baseline;gap:10px}
.idx b{font:500 30px/1 var(--serif);font-variant-numeric:tabular-nums}
.idx span{color:var(--ink2);font-size:12px}
.curve{width:100%;height:58px;display:block}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.meta span{color:var(--ink2)}
details.wl{border-top:1px solid var(--rule)}
.w.wm{grid-template-columns:1fr 72px auto;align-items:center}
.mini{width:72px;height:14px;display:block}
.card .addr{color:var(--ink2);font-size:12px;margin-top:-4px}
.card .fine{color:var(--ink2);font-size:11.5px;line-height:1.4;margin:4px 0 0}
details.nts .act{margin:10px 0 4px}
.w.clk{cursor:pointer}.w.clk:hover{background:var(--paper2)}
.rtitle{position:absolute;top:58px;left:50%;transform:translateX(-50%);font:italic 400 28px/1 var(--serif);color:var(--ink);letter-spacing:.01em;pointer-events:none!important;opacity:0;transition:opacity .5s;white-space:nowrap}
.rtitle.on{opacity:.85}
.cepdd .dd-m button[aria-checked="true"]::before{content:"✓ "}
.cepdd .dd-m button[aria-checked="false"]::before{content:"\00a0\00a0\00a0 "}
details.wl summary{cursor:pointer;padding:9px 0 3px;font-size:13px;color:var(--ink);list-style:none;display:flex;justify-content:space-between}
details.wl summary::after{content:"+";color:var(--ink2)}
details.wl[open] summary::after{content:"–"}
.w{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13px}
.w small{display:block;color:var(--ink2);font-size:11px}
.w .p{font-variant-numeric:tabular-nums}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.tag.hg{color:var(--olive)} .tag.pr{color:var(--wine)}
.act{background:none;border:1px solid var(--ink);padding:8px 12px;border-radius:2px;cursor:pointer;font-size:13px;align-self:flex-start}
.act:hover{background:var(--ink);color:var(--paper)}

/* tooltip */
.tip{position:fixed;pointer-events:none;background:var(--paper);border:1px solid var(--rule2);padding:6px 9px;font-size:12px;line-height:1.35;z-index:50;opacity:0;transition:opacity .12s;max-width:240px}
.tip b{font-weight:600}

/* prices */
.pv{display:flex;flex-direction:column;height:100%;padding:14px max(20px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(20px,env(safe-area-inset-left,0px))}
.ctrls{display:flex;flex-wrap:wrap;gap:4px 26px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:13px}
.chip{border:0;background:none;color:var(--ink2);padding:2px 0;cursor:pointer;border-bottom:1px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--wine)}
.chart{flex:1;min-height:0;position:relative;margin-top:4px}
.chart svg{width:100%;height:100%;display:block}
.axis text{fill:var(--ink2);font:11px var(--sans)}
.axis path,.axis line{stroke:var(--rule2)}
.grid line{stroke:var(--rule);stroke-width:.6}
.rowlab{font:500 19px var(--serif);fill:var(--ink)}
.rowsub{font:11px var(--sans);fill:var(--ink2);font-variant-numeric:tabular-nums}

/* estimator */
.est{display:grid;grid-template-columns:320px 1fr;height:100%}
.form{padding:20px 26px calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow-y:auto;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--rule)}
.form h2{font:500 26px/1.1 var(--serif);margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink2)}
select,input[type=number]{background:transparent;border:0;border-bottom:1px solid var(--rule2);border-radius:0;padding:6px 0;width:100%}
select:focus,input:focus{outline:none;border-bottom-color:var(--wine)}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.tg input{accent-color:var(--wine);width:16px;height:16px}
.own{display:flex;flex-direction:column;gap:4px}
.own .row{display:grid;grid-template-columns:1fr 64px 24px;gap:8px;align-items:end}
.own .row button,.lnk{border:0;background:none;color:var(--wine);cursor:pointer;padding:4px 0;text-align:left}
.res{padding:24px max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 34px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.big{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.big b{font:400 68px/1 var(--serif);font-variant-numeric:tabular-nums}
.big b small{font-size:22px;color:var(--ink2);margin-right:6px}
.big span{color:var(--ink2);font-size:14px}
.big span strong{color:var(--ink);font-weight:600}
#estChart{width:100%;height:150px;display:block}
.steps{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.steps b{color:var(--ink);font-weight:600}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{text-align:left;font-weight:400;color:var(--ink2);font-size:12px;padding:0 10px 6px 0;border-bottom:1px solid var(--rule2)}
.cmp td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.cmp td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.h3{font:500 18px var(--serif);margin:0 0 6px}

/* search + notes */
.range{display:flex;align-items:end;gap:8px}.range input{width:70px}.range .u{color:var(--ink2);font-size:12px}
.sum{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px}
.cv{border-top:1px solid var(--rule2);padding-top:8px}
.cvh{display:flex;gap:8px;align-items:baseline;background:none;border:0;padding:0 0 2px;cursor:pointer;font:500 17px var(--serif);color:var(--ink);text-align:left}
.cvh:hover{color:var(--wine)} .cvh small{font:12px var(--sans);color:var(--ink2)}
.empty{color:var(--ink2)}
.tag.nt{color:var(--ink);background:var(--paper2);padding:1px 5px;letter-spacing:0;text-transform:none}
.w.clk{cursor:pointer} .w.clk:hover{background:var(--paper2)}
.nsc{font:500 16px var(--serif)}
.ntxt{max-width:760px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.nh{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}.nh .cnt{color:var(--ink2)}
.note{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:12px 0;border-top:1px solid var(--rule)}
.note .sc{font:400 30px/1 var(--serif);font-variant-numeric:tabular-nums}.note .sc small{font:11px var(--sans);color:var(--ink2);margin-left:2px}
.nt1{font:500 18px var(--serif)} .nt2{color:var(--ink2);font-size:13px} .nt2 .lnk{padding:0;font-size:13px}
.note p{margin:6px 0 0;font-size:14px;max-width:62ch}
.ndlg{border:1px solid var(--rule2);border-radius:3px;background:var(--paper);color:var(--ink);padding:0;width:min(460px,calc(100% - 32px))}
.ndlg::backdrop{background:rgba(43,31,25,.35)}
.nform{padding:20px;display:flex;flex-direction:column;gap:12px}.nform h3{font:500 22px var(--serif);margin:0}
.nform input[type=text],.nform input[type=date],.nform textarea{background:transparent;border:0;border-bottom:1px solid var(--rule2);padding:6px 0;width:100%;font:inherit;color:inherit}
.nform textarea{border:1px solid var(--rule2);padding:6px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px}
.btns{display:flex;justify-content:space-between;align-items:center}
.err{color:var(--wine);font-size:13px;margin:0}

/* about */
.about{height:100%;overflow-y:auto}
.about .band{width:100%;height:min(42vh,380px);object-fit:cover;display:block}
.about .txt{max-width:640px;margin:0 auto;padding:30px max(20px,env(safe-area-inset-left,0px)) calc(50px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;font:400 18px/1.55 var(--serif)}
.about h2{font:500 32px/1.1 var(--serif);margin:0}
.about .sig{font-style:italic;color:var(--ink2)}
.about .notes{font:13px/1.55 var(--sans);color:var(--ink2);border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.about figure{margin:6px 0}
.about figure img{width:100%;display:block}
.about figcaption{font:12px var(--sans);color:var(--ink2);margin-top:4px}

@media (max-width:760px){
  .brand{font-size:19px}
  .top{gap:14px}
  .est{grid-template-columns:1fr;overflow-y:auto}
  .form{border-right:0;border-bottom:1px solid var(--rule);overflow:visible;padding-right:max(20px,env(safe-area-inset-right,0px))}
  .res{overflow:visible;padding-left:max(20px,env(safe-area-inset-left,0px))}
  .card{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:62%}
  .reset{top:56px;left:max(20px,env(safe-area-inset-left,0px))}
  .big b{font-size:54px}
  .legend .ramp i{width:16px}
}
@media (max-width:440px){ .brand{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<header class="top">
  <div class="brand">Vins du Valais</div>
  <div class="dd" id="dd-view"></div>
  <div class="sp"></div>

</header>

<main class="stage">

      <div class="legend" id="legend"></div>
      <div class="rtitle" id="rtitle"></div>
      <aside class="card" id="card" aria-live="polite"></aside>
    </div>
  </section>
  <section class="view" id="view-prix">

  </section>
  <section class="view" id="view-chercher">

  </section>
  <section class="view" id="view-apropos"><div class="about" id="about"></div></section>
</main>
<div class="tip" id="tip"></div>
<dialog class="ndlg" id="ndlg"></dialog>

function wQuantile(arr, q){ const tot = d3.sum(arr, d => d.w); let acc = 0; for (const d of arr){ acc += d.w; if (acc >= q * tot) return d.p; } return arr.at(-1).p; }
function ridge(s, rows, x, w, h, opts){
  const narrow = w < 640, left = opts.left, top = 10, bottom = 34;
  const rowH = (h - top - bottom) / rows.length;
  rows.forEach((g, i) => {
    const y0 = top + i * rowH, base = y0 + rowH - 6, amp = rowH * 0.78;
    const gg = s.append('g');
    const tot = d3.sum(g.vals, d => d.w);
    const dens = opts.grid.map(u => [u, d3.sum(g.vals, d => d.w * Math.exp(-0.5 * ((u - d.u) / opts.bw) ** 2)) / tot]);
    const ym = d3.max(dens, d => d[1]), yk = v => base - (v / ym) * amp * 0.62;
    gg.append('path').datum(dens).attr('d', d3.area().x(d => x(d[0])).y0(base).y1(d => yk(d[1])).curve(d3.curveBasis))
      .attr('fill', COL.wine).attr('fill-opacity', .07).attr('stroke', COL.wine).attr('stroke-width', 1.2).attr('opacity', 0).transition().duration(500).delay(i * 40).attr('opacity', 1);
    gg.append('line').attr('x1', left).attr('x2', w - 20).attr('y1', base).attr('y2', base).attr('stroke', COL.rule2).attr('stroke-width', .7);
    if (g.q1 != null) gg.append('rect').attr('x', x(g.q1)).attr('width', Math.max(1, x(g.q3) - x(g.q1))).attr('y', base + 2).attr('height', 3).attr('fill', COL.wine).attr('opacity', .35);
    const mx = x(g.med); gg.append('line').attr('x1', mx).attr('x2', mx).attr('y1', base).attr('y2', base - amp * 0.7).attr('stroke', COL.ink).attr('stroke-width', 1);
    const rnd = d3.randomLcg(i + 11);
    gg.append('g').selectAll('circle').data(g.vals).join('circle')
      .attr('cx', d => x(d.u)).attr('cy', () => base - 3 - rnd() * amp * 0.92).attr('r', opts.r)
      .attr('fill', d => opts.color ? opts.color(d) : COL.ink).attr('fill-opacity', d => opts.color ? .8 : (PS.weight === 'c' ? Math.min(.8, .12 + d.w * .8) : .32))
      .style('cursor', 'pointer').on('mousemove', (e, d) => showTip(e, opts.tip(d))).on('mouseleave', hideTip)
      .on('click', (e, d) => { setView('carte'); openCard({type:'cave', i:d.cave}, true); });
    if (narrow){ gg.append('text').attr('class', 'rowlab').attr('x', left).attr('y', y0 + 16).style('font-size', '16px').text(g.name); gg.append('text').attr('class', 'rowsub').attr('x', left).attr('y', y0 + 30).text(g.sub); }
    else { gg.append('text').attr('class', 'rowlab').attr('x', 0).attr('y', base - 18).text(g.name); gg.append('text').attr('class', 'rowsub').attr('x', 0).attr('y', base - 3).text(g.sub); }
  });
}

}

function runSearch(){
  const tt = t(), res = searchResults();
  const byCave = d3.groups(res, w => w.c).sort((a, b) => d3.median(a[1], w => w.p) - d3.median(b[1], w => w.p));
  const el = $('#sres');
  el.innerHTML = `<div class="sum"><span><b>${nf(res.length)}</b> ${tt.winesW} · <b>${nf(byCave.length)}</b> ${tt.caves}</span>${byCave.length ? `<button class="act" type="button" id="s-map">${tt.showOnMap}</button>` : ''}</div>
   ${byCave.length ? byCave.map(([ci, ws]) => { const c = caves[ci]; return `<div class="cv"><button type="button" class="cvh" data-i="${ci}"><span>${esc(c.n)}</span><small>${esc(c.v || c.com)}</small></button>
     ${ws.sort((a, b) => a.p - b.p).map(w => `<div class="w"><div>${esc(w.cu || cepName(w.gr))}${w.tier !== 'cl' ? `<span class="tag ${w.tier}">${tt.tiers[w.tier]}</span>` : ''}<small>${esc(cepName(w.gr))}</small></div><div class="p">${chf(w.p)}</div></div>`).join('')}</div>`; }).join('')
     : `<p class="empty">${tt.noResult}</p>`}`;
  el.querySelectorAll('.cvh').forEach(b => b.onclick = () => { setView('carte'); openCard({type:'cave', i:+b.dataset.i}, true); });
  const m = $('#s-map'); if (m) m.onclick = () => { mapFilter = new Set(byCave.map(d => d[0])); applyMapFilter(); setView('carte'); };
}
function applyMapFilter(){
  caveDots.transition().duration(400).style('opacity', d => !mapFilter || mapFilter.has(d.i) ? 1 : 0.12).style('pointer-events', d => !mapFilter || mapFilter.has(d.i) ? 'auto' : 'none');
  drawLegend();
}

/* ---------- tasting notes (db) ---------- */
let db = null, notesOn = false, canWrite = false, NOTES = [], noteSort = 'date';
const notesFor = w => NOTES.filter(n => n.key === wineKey(w));
const noteBadge = ns => { const b = ns.reduce((a, n) => (n.score ?? 0) > (a.score ?? 0) ? n : a, ns[0]); return `${b.score != null ? nf(b.score) : '✓'}${b.vintage ? ' · ' + b.vintage : ''}`; };
const caveNotes = ci => NOTES.filter(n => n.cave === caves[ci].n);
(async () => {
  try {
    db = await window.claude?.use?.('db');
    const user = await window.claude?.use?.('user');
    if (!db) return;
    notesOn = true;
    canWrite = user ? (user.isOwner() || false) : false;
    db.collection('notes').onSnapshot(snap => {
      NOTES = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if (cardState) openCard(cardState, false);
    }, () => { notesOn = false; });
    if (cardState) openCard(cardState, false);
  } catch (e) {}
})();
function renderNotes(){}
const caveNames = caves.map((c, i) => ({n:c.n, i})).sort((a, b) => a.n.localeCompare(b.n, 'fr'));
function openNoteEditor(pre){
  if (!canWrite) return;
  const tt = t(), dlg = $('#ndlg');
  let ci = pre.cave != null ? caves.findIndex(c => c.n === pre.cave) : (pre.ci ?? -1);
  const today = new Date().toISOString().slice(0, 10);
  const draw = () => {
    const ws = ci >= 0 ? winesOf(ci) : [];
    const curKey = pre.key || '';
    dlg.innerHTML = `<form class="nform" id="nform"><h3>${pre.id ? tt.editNote : tt.addNote}</h3>
      <div class="field"><label for="n-cave">${tt.caveL}</label><select id="n-cave"><option value="-1">—</option>${caveNames.map(o => `<option value="${o.i}"${o.i === ci ? ' selected' : ''}>${esc(o.n)}</option>`).join('')}</select></div>
      <div class="field"><label for="n-wine">${tt.wineL}</label><select id="n-wine">${ws.map(w => `<option value="${esc(wineKey(w))}"${wineKey(w) === curKey ? ' selected' : ''}>${esc((w.cu || cepName(w.gr)) + ' · ' + chf(w.p))}</option>`).join('')}<option value="__other"${curKey && !ws.some(w => wineKey(w) === curKey) ? ' selected' : ''}>${tt.otherWine}</option></select></div>
      <div class="field" id="n-otherf"><label for="n-other">${tt.wineName}</label><input id="n-other" type="text" value="${esc(pre.cuvee || '')}"></div>
      <div class="two"><div class="field"><label for="n-vint">${tt.vintage}</label><input id="n-vint" type="number" min="1950" max="2030" value="${esc(pre.vintage || '')}"></div>
       <div class="field"><label for="n-score">${tt.score}</label><input id="n-score" type="number" min="50" max="100" step="1" value="${pre.score ?? ''}"></div>
       <div class="field"><label for="n-date">${tt.dateL}</label><input id="n-date" type="date" value="${esc(pre.date || today)}"></div></div>
      <div class="field"><label for="n-com">${tt.commentL}</label><textarea id="n-com" rows="3">${esc(pre.comment || '')}</textarea></div>
      <p class="err" id="n-err" hidden></p>
      <div class="btns">${pre.id ? `<button type="button" class="lnk" id="n-del">${tt.del}</button>` : '<span></span>'}<span><button type="button" class="lnk" id="n-cancel">${tt.cancel}</button> <button type="submit" class="act">${tt.save}</button></span></div></form>`;
    const sync = () => { $('#n-otherf').hidden = $('#n-wine').value !== '__other' && ws.length > 0; };
    $('#n-cave').onchange = e => { ci = +e.target.value; pre = {...pre, key:''}; draw(); };
    $('#n-wine').onchange = sync; sync();
    $('#n-cancel').onclick = () => dlg.close();
    if ($('#n-del')) $('#n-del').onclick = async () => { try { await db.collection('notes').doc(pre.id).delete(); dlg.close(); } catch (e) { showErr(e); } };
    $('#nform').onsubmit = async e => {
      e.preventDefault();
      const wv = $('#n-wine').value, w = ws.find(x => wineKey(x) === wv);
      const cuvee = w ? (w.cu || cepName(w.gr)) : $('#n-other').value.trim();
      if (ci < 0 || !cuvee) { showErr({message:tt.needWine}); return; }
      const sc = $('#n-score').value === '' ? null : Math.max(0, Math.min(100, +$('#n-score').value));
      const doc = {cave:caves[ci].n, key:w ? wineKey(w) : `${caves[ci].n}|${cuvee}|`, cuvee, cep:w ? w.gr : '', vintage:$('#n-vint').value ? +$('#n-vint').value : null,
        score:sc, date:$('#n-date').value || today, comment:$('#n-com').value.trim(), price:w ? w.p : null};
      try { await (pre.id ? db.collection('notes').doc(pre.id) : db.collection('notes').doc()).set(doc); dlg.close(); }
      catch (err) { showErr(err); }
    };
  };
  const showErr = e => { const x = $('#n-err'); x.textContent = (e && e.code === 'quota_exceeded') ? tt.quota : tt.saveErr; x.hidden = false; };
  draw(); dlg.showModal();
}

/* ---------- about ---------- */
function buildAbout(){
  const a = t().about;
  $('#about').innerHTML = `<img class="band" src="img/user1.jpg" alt="">
   <div class="txt"><h2>${a.t}</h2>${a.p.map(p => `<p style="margin:0">${p}</p>`).join('')}<p class="sig" style="margin:0">${a.sig}</p>
    <figure><img src="img/user3.jpg" alt="" loading="lazy"><figcaption>${a.cap}</figcaption></figure>
    <div class="notes">${a.notes.map(n => `<div>${n}</div>`).join('')}</div></div>`;
}

/* ---------- boot ---------- */
applyLang(); colorCaves();
setView((location.hash || '#carte').slice(1), false);
requestAnimationFrame(() => sizeMap());
</script>
